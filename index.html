<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A fully playable Ludo board game built with HTML, CSS, and vanilla JavaScript. 2-4 players, dice rolls, captures, safe zones, and win detection." />
  <title>Ludo Game — Play Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="game-header">
    <h1>🎲 Ludo Game</h1>
    <p>Roll the dice, move your tokens, and race to the finish!</p>
  </header>

  <!-- ============ SETUP SCREEN ============ -->
  <section class="setup-screen setup-entrance" id="setupScreen">
    <div class="setup-icon">🎮</div>
    <h2>New Game</h2>
    <label for="playerCount">Number of Players</label>
    <select id="playerCount">
      <option value="2">2 Players (Green &amp; Blue)</option>
      <option value="3">3 Players (Green, Red &amp; Blue)</option>
      <option value="4" selected>4 Players</option>
    </select>
    <button class="btn-start" id="btnStart" aria-label="Start a new game">Start Game</button>
  </section>

  <!-- ============ GAME CONTAINER ============ -->
  <div class="game-container" id="gameContainer">

    <!-- Info Bar -->
    <div class="info-bar">
      <div class="info-card" id="infoCardTurn">
        <div class="label">Current Turn</div>
        <div class="value" id="currentPlayer">
          <span class="turn-indicator" id="turnIndicator"></span>
          Green
        </div>
      </div>
      <div class="info-card" id="infoCardDice">
        <div class="label">Dice Roll</div>
        <div class="value" id="diceResult">—</div>
      </div>
      <div class="info-card" id="infoCardStatus">
        <div class="label">Status</div>
        <div class="value" id="statusMsg">Roll the dice!</div>
      </div>
    </div>

    <!-- Main Area -->
    <div class="main-area">

      <!-- Board -->
      <div class="board-wrapper">
        <div class="board" id="board">
          <!-- 15x15 = 225 cells rendered by JS -->
        </div>
      </div>

      <!-- Sidebar -->
      <div class="sidebar">

        <!-- Dice -->
        <div class="dice-area">
          <h3>Dice</h3>
          <div class="dice-stage">
            <div class="dice" id="dice">
              <div class="dot" data-pos="1"></div>
              <div class="dot" data-pos="2"></div>
              <div class="dot" data-pos="3"></div>
              <div class="dot" data-pos="4"></div>
              <div class="dot" data-pos="5"></div>
              <div class="dot" data-pos="6"></div>
              <div class="dot" data-pos="7"></div>
              <div class="dot" data-pos="8"></div>
              <div class="dot" data-pos="9"></div>
            </div>
          </div>
          <div class="dice-value-display" id="diceValueDisplay"></div>
          <button class="btn-roll" id="btnRoll" aria-label="Roll the dice">🎲 Roll Dice</button>
        </div>

        <!-- Player Scores -->
        <div class="player-scores" id="playerScores">
          <h3>Players</h3>
          <!-- Rendered by JS -->
        </div>

        <!-- Messages -->
        <div class="message-area">
          <h3>Game Log</h3>
          <ul class="msg-list" id="msgList"></ul>
        </div>

        <!-- Actions -->
        <div class="action-area">
          <button class="btn-restart" id="btnRestart" aria-label="Restart the game">🔄 Restart Game</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ WINNER OVERLAY ============ -->
  <div class="winner-overlay" id="winnerOverlay">
    <div class="confetti-container" id="confetti"></div>
    <div class="winner-card">
      <div class="trophy">🏆</div>
      <h2 id="winnerText">Green Wins!</h2>
      <p>Congratulations! All 4 tokens have reached home.</p>
      <button class="btn-restart" id="btnRestartWinner" aria-label="Play again">🔄 Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
